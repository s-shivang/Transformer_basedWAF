# ==============================================================================
# Nginx Reverse Proxy Gateway Configuration for Transformer-Based WAF
# Architecture: Client -> Nginx (8080) -> WAF Gateway (8001) -> App (8002)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format including WAF diagnostic headers
    log_format waf_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'waf_action="$upstream_http_x_waf_action" '
                            'waf_req_id="$upstream_http_x_waf_request_id" '
                            'waf_latency="$upstream_http_x_waf_latency_ms"ms';

    access_log  logs/waf_access.log  waf_combined;
    error_log   logs/waf_error.log   warn;

    # Upstream Definitions
    upstream waf_inspection_gateway {
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        # ----------------------------------------------------------------------
        # Request Size Constraints (Matching WAF Policy Envelopes)
        # ----------------------------------------------------------------------
        client_max_body_size        64k;
        client_body_buffer_size     64k;

        # Timeouts
        proxy_connect_timeout       2s;
        proxy_read_timeout          15s;
        proxy_send_timeout          15s;

        # Proxy Buffering - ensures entire body reaches WAF inspection proxy
        proxy_buffering             on;
        proxy_buffer_size           8k;
        proxy_buffers               8 8k;

        # ----------------------------------------------------------------------
        # Custom Error Pages & 503 Fallback (Gateway Unreachable)
        # ----------------------------------------------------------------------
        error_page 502 503 504 /waf_gateway_down.json;

        location = /waf_gateway_down.json {
            internal;
            default_type application/json;
            return 503 '{"error": "WAF Inspection Gateway Unavailable", "status": 503, "detail": "The security inspection gateway is temporarily unreachable. Please retry shortly."}';
        }

        # ----------------------------------------------------------------------
        # Forward All Traffic to WAF Inspection Reverse-Proxy Gateway
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://waf_inspection_gateway;

            # HTTP 1.1 with Keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard Client Identity Headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass-through of WAF Diagnostic Headers to Clients
            proxy_pass_header X-WAF-Action;
            proxy_pass_header X-WAF-Would-Action;
            proxy_pass_header X-WAF-Request-ID;
            proxy_pass_header X-WAF-Mode;
            proxy_pass_header X-WAF-Latency-Ms;
            proxy_pass_header X-WAF-Degraded;
        }

        # ----------------------------------------------------------------------
        # Public WAF Challenge Verification Endpoints (Allowed for Browsers)
        # ----------------------------------------------------------------------
        location ^~ /_waf/challenge/ {
            proxy_pass http://waf_inspection_gateway/_waf/challenge/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # Internal WAF Administration Endpoints (Blocked from External Clients)
        # ----------------------------------------------------------------------
        location ^~ /_waf/policy {
            return 403 '{"error": "Forbidden", "detail": "Access to WAF policy administration is restricted to internal network"}';
        }

        location /_waf/ {
            # Only allow loopback or internal callers if configured, block external by default
            allow 127.0.0.1;
            deny all;
            proxy_pass http://waf_inspection_gateway/_waf/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
